[build-system]
requires = ["clingo>=5.8,<5.9", "scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "clingcon"
dynamic = ["version"]
description = "CFFI-based bindings to the clingcon solver."
readme = { text = """
This package allows for adding the clingcon propagator as a
theory to clingcon.

It can also be used as a clingcon solver running:

    python -m clingcon CLINGCON_ARGUMENTS
""", content-type = "text/markdown" }
authors = [{ name = "Roland Kaminski", email = "kaminski@cs.uni-potsdam.de" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["clingo>=5.8,<5.9", "cffi"]

[project.scripts]
pyclingcon = "clingcon.__main__:main"

[project.urls]
Homepage = "https://github.com/potassco/clingcon"

[[tool.dynamic-metadata]]
provider = { path = "scripts", module = "meta" }

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.args = [
    '-DCLINGCON_MANAGE_RPATH=OFF',
    '-DPYCLINGCON_ENABLE=pip',
    '-DPYCLINGCON_INSTALL_DIR=.',
]

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} -v --exclude \"_clingo*.pyd\" {wheel}"
