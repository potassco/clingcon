name: Build and upload to PyPI

on:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build ${{ matrix.cfg.name }} wheels
    runs-on: ${{ matrix.cfg.os }}
    strategy:
      matrix:
        cfg:
          - os: ubuntu-latest
            name: "*-manylinux_x86_64"
            env:
              CIBW_ARCHS_LINUX: x86_64
              CIBW_BUILD: "cp313-manylinux_x86_64"
          - os: ubuntu-latest
            name: "*-musllinux_x86_64"
            env:
              CIBW_ARCHS_LINUX: x86_64
              CIBW_BUILD: "cp313-musllinux_x86_64"
          - os: ubuntu-latest
            name: "*-manylinux_i686"
            env:
              CIBW_ARCHS_LINUX: i686
              CIBW_BUILD: "cp313-manylinux_i686"
          - os: ubuntu-latest
            name: "*-musllinux_i686"
            env:
              CIBW_ARCHS_LINUX: i686
              CIBW_BUILD: "cp313-musllinux_i686"
          - os: ubuntu-latest
            name: "cp*-manylinux-aarch64"
            env:
              CIBW_ARCHS_LINUX: aarch64
              CIBW_BUILD: "cp313-manylinux_aarch64"
          - os: ubuntu-latest
            name: "*-manylinux-ppc64le"
            env:
              CIBW_ARCHS_LINUX: ppc64le
              CIBW_BUILD: "cp313-manylinux_ppc64le"
          - os: windows-latest
            name: "cp*-win*"
            env:
              CIBW_BUILD: "cp313-win_*"
          - os: macos-14
            name: "*-macos_x86_64"
            env:
              CIBW_ARCHS_MACOS: x86_64
              CIBW_BUILD: "cp313-macosx_x86_64"
          - os: macos-14
            name: "*-macos_arm64"
            env:
              CIBW_ARCHS_MACOS: arm64
              CIBW_BUILD: "cp313-macosx_arm64"
          - os: ubuntu-latest
            name: "*-manylinux_x86_64"
            env:
              CIBW_ARCHS_LINUX: x86_64
              CIBW_BUILD: "cp314-manylinux_x86_64"
          - os: ubuntu-latest
            name: "*-musllinux_x86_64"
            env:
              CIBW_ARCHS_LINUX: x86_64
              CIBW_BUILD: "cp314-musllinux_x86_64"
          # cffi is not available for this platform
          # - os: ubuntu-latest
          #   name: "*-manylinux_i686"
          #   env:
          #     CIBW_ARCHS_LINUX: i686
          #     CIBW_BUILD: "cp314-manylinux_i686"
          - os: ubuntu-latest
            name: "*-musllinux_i686"
            env:
              CIBW_ARCHS_LINUX: i686
              CIBW_BUILD: "cp314-musllinux_i686"
          - os: ubuntu-latest
            name: "cp*-manylinux-aarch64"
            env:
              CIBW_ARCHS_LINUX: aarch64
              CIBW_BUILD: "cp314-manylinux_aarch64"
          - os: ubuntu-latest
            name: "*-manylinux-ppc64le"
            env:
              CIBW_ARCHS_LINUX: ppc64le
              CIBW_BUILD: "cp314-manylinux_ppc64le"
          - os: windows-latest
            name: "cp*-win*"
            env:
              CIBW_BUILD: "cp314-win_*"
          - os: macos-14
            name: "*-macos_x86_64"
            env:
              CIBW_ARCHS_MACOS: x86_64
              CIBW_BUILD: "cp314-macosx_x86_64"
          - os: macos-14
            name: "*-macos_arm64"
            env:
              CIBW_ARCHS_MACOS: arm64
              CIBW_BUILD: "cp314-macosx_arm64"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Adjust version (release)
        run: python .github/adjust_version.py --release

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env: ${{ matrix.cfg.env }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.cfg.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN_RELEASE }}
