{% set version = environ.get('VERSION_NUMBER', '5.2.1') %}
{% set build = environ.get('BUILD_NUMBER', "0") %}

package:
  name: clingcon
  version: {{ version }}

source:
  path: ../..

requirements:
  build:
  - cmake
  - ninja
  - {{ compiler('c') }}
  - {{ compiler('cxx') }}
  host:
  - pytest
  - python
  - clingo>=6
  run:
  - python
  - {{ pin_compatible('clingo', max_pin='x.x') }}

build:
  number: {{ build }}

test:
  commands:
  - clingcon --version
  - python -c "import clingcon"

about:
  home: https://potassco.org/
  license: MIT
  summary: A solver for logic programs with difference constraints.
  description: The clingcon solver extends the clingo ASP system with support for linear constraints over integers.
  license_file: LICENSE.md
  doc_url: https://potassco.org/
  dev_url: https://github.com/potassco/clingcon
