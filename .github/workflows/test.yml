name: CI

on:
  push:
    branches:
      - master
      - wip
      - wip-20
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            generator: "Ninja Multi-Config"
            environment-file: .github/test-environment-linux.yml
          - os: macos-latest
            generator: "Ninja Multi-Config"
            environment-file: .github/test-environment.yml
          - os: windows-latest
            generator: "Visual Studio 18 2026"
            environment-file: .github/test-environment.yml
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{ matrix.environment-file }}
          condarc: |
            channel_priority: strict
            channels:
              - potassco/label/dev-20
              - conda-forge

      - name: Configure
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" \
            -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX" \
            -DCLINGCON_BUILD_TESTS=On \
            -DCLINGCON_BUILD_APP=On

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Test
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: |
          cmake --install build --config Release
          clingcon --version
